spring:
  application:
    name: bajrix-marketplace
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bajrix_marketplace?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: info
